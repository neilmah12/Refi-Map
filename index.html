<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Edmonton Multifamily Sales – Westmount / West Central</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css"/>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>

  <!-- MarkerCluster -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.1.0/MarkerCluster.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.1.0/MarkerCluster.Default.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.1.0/leaflet.markercluster.js"></script>

  <!-- Awesome Markers (glyphicon clock icon for refi layer) -->
  <link rel="stylesheet" href="https://netdna.bootstrapcdn.com/bootstrap/3.0.0/css/bootstrap-glyphicons.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.js"></script>

  <!-- Leaflet Heatmap -->
  <script src="https://cdn.jsdelivr.net/gh/python-visualization/folium@main/folium/templates/leaflet_heat.min.js"></script>

  <!-- D3 v3 (colorscale) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.5/d3.min.js"></script>

  <!-- SheetJS (Excel export) -->
  <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Typography -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      margin: 0; padding: 0;
      font-family: 'DM Sans', sans-serif;
    }

    /* ── Map ── */
    #map {
      position: absolute;
      top: 0; bottom: 0; right: 0;
      left: 400px;
    }
    .leaflet-left { left: 400px !important; }

    /* ── Sidebar ── */
    #sidebar {
      position: fixed;
      top: 0; left: 0;
      width: 400px;
      height: 100vh;
      background: #0f1923;
      color: #e8edf2;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 24px rgba(0,0,0,0.4);
      transition: transform 0.3s ease;
    }
    #sidebar.collapsed { transform: translateX(-400px); }

    #sidebar-toggle {
      position: fixed;
      top: 50%; left: 400px;
      transform: translateY(-50%);
      z-index: 10000;
      background: #0f1923;
      color: #e8edf2;
      border: none;
      width: 28px; height: 64px;
      cursor: pointer;
      border-radius: 0 6px 6px 0;
      font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      transition: left 0.3s ease;
    }

    /* ── Sidebar sections ── */
    #sidebar-header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid #1e2e3d;
    }
    #sidebar-header h2 {
      margin: 0 0 2px;
      font-size: 15px; font-weight: 700; color: #fff;
    }
    #sidebar-header p { margin: 0; font-size: 12px; color: #7a94a8; }

    #filter-bar {
      padding: 8px 12px;
      border-bottom: 1px solid #1e2e3d;
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .filter-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px; font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid #2a3f52;
      background: transparent; color: #7a94a8;
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn:hover          { border-color: #4a9eff; color: #4a9eff; }
    .filter-btn.active         { background: #4a9eff; border-color: #4a9eff; color: #fff; }
    .filter-btn.refi-btn.active{ background: #e67e00; border-color: #e67e00; color: #fff; }

    /* ── Filter sections ── */
    .filter-section {
      padding: 10px 14px;
      border-bottom: 1px solid #1e2e3d;
    }
    .filter-section label {
      font-size: 10px; font-weight: 600;
      color: #7a94a8;
      text-transform: uppercase; letter-spacing: 0.06em;
      display: block; margin-bottom: 6px;
    }
    .filter-row {
      display: flex; gap: 6px; align-items: center; margin-bottom: 4px;
    }
    .filter-row span { font-size: 11px; color: #4a6070; white-space: nowrap; min-width: 28px; }
    .filter-input {
      flex: 1;
      background: #1a2a38; border: 1px solid #2a3f52; border-radius: 5px;
      padding: 5px 7px;
      font-family: 'DM Sans', sans-serif; font-size: 11px; color: #e8edf2;
      outline: none; width: 100%;
    }
    .filter-input:focus { border-color: #4a9eff; }
    .filter-input::-webkit-calendar-picker-indicator { filter: invert(0.6); cursor: pointer; }
    .filter-input[type="number"]::-webkit-inner-spin-button,
    .filter-input[type="number"]::-webkit-outer-spin-button { opacity: 0.4; }

    /* inline min/max pair */
    .range-pair {
      display: flex; gap: 5px; align-items: center;
    }
    .range-pair .filter-input { min-width: 0; }
    .range-pair .sep { font-size: 11px; color: #4a6070; }

    .filter-reset {
      font-family: 'DM Sans', sans-serif; font-size: 10px;
      color: #4a6070; background: none; border: none;
      cursor: pointer; padding: 2px 0 0; text-decoration: underline; float: right;
      margin-top: -18px;
    }
    .filter-reset:hover { color: #7a94a8; }

    /* ── Advanced filters toggle ── */
    #adv-toggle {
      padding: 8px 14px;
      border-bottom: 1px solid #1e2e3d;
      font-size: 11px; font-weight: 600; color: #4a9eff;
      cursor: pointer; user-select: none;
      display: flex; align-items: center; gap: 5px;
    }
    #adv-toggle:hover { color: #79b8ff; }
    #adv-toggle .adv-arrow { transition: transform 0.2s; display: inline-block; }
    #adv-toggle.open .adv-arrow { transform: rotate(90deg); }

    #adv-filters {
      display: none;
      border-bottom: 1px solid #1e2e3d;
      background: #0c1620;
    }
    #adv-filters.open { display: block; }
    #adv-filters .filter-section { border-bottom: 1px solid #162130; }
    #adv-filters .filter-section:last-child { border-bottom: none; }

    /* ── Search box ── */
    #search-box {
      padding: 8px 14px;
      border-bottom: 1px solid #1e2e3d;
    }
    #search-box input {
      width: 100%;
      background: #1a2a38; border: 1px solid #2a3f52; border-radius: 6px;
      padding: 6px 10px;
      font-family: 'DM Sans', sans-serif; font-size: 11px; color: #e8edf2;
      outline: none;
    }
    #search-box input::placeholder { color: #4a6070; }
    #search-box input:focus { border-color: #4a9eff; }

    /* ── Sort + count bar ── */
    #list-controls {
      padding: 6px 14px;
      display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid #1e2e3d;
    }
    #prop-count {
      font-size: 11px; color: #4a6070; font-weight: 500; flex: 1;
    }
    #sort-select {
      background: #1a2a38; border: 1px solid #2a3f52; border-radius: 5px;
      padding: 4px 6px;
      font-family: 'DM Sans', sans-serif; font-size: 11px; color: #e8edf2;
      outline: none; cursor: pointer;
    }
    #sort-select:focus { border-color: #4a9eff; }

    /* ── Export button ── */
    #export-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 10px; font-weight: 600;
      padding: 4px 8px;
      background: #0d2210; border: 1px solid #1e4a1e; border-radius: 5px;
      color: #5aaa5a; cursor: pointer; white-space: nowrap;
      transition: all 0.15s;
    }
    #export-btn:hover { background: #122a12; border-color: #2a6a2a; color: #7acc7a; }

    /* ── Stats bar ── */
    #stats-bar {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 1px; background: #1e2e3d;
      border-bottom: 1px solid #1e2e3d;
      flex-shrink: 0;
    }
    .stat-item { background: #0f1923; padding: 6px 8px; text-align: center; }
    .stat-val   { display: block; font-size: 13px; font-weight: 700; color: #fff; }
    .stat-label { display: block; font-size: 9px; font-weight: 600; color: #4a6070;
                  text-transform: uppercase; letter-spacing: 0.05em; margin-top: 1px; }

    /* ── Time slider ── */
    #time-slider-bar {
      padding: 7px 12px 6px;
      border-bottom: 1px solid #1e2e3d;
      flex-shrink: 0;
      background: #0c1620;
    }
    #time-slider-bar .ts-row {
      display: flex; align-items: center; gap: 7px;
    }
    #time-slider-bar .ts-label {
      font-size: 10px; font-weight: 700; color: #7a94a8;
      text-transform: uppercase; letter-spacing: 0.06em;
      white-space: nowrap;
    }
    #year-slider {
      flex: 1; accent-color: #4a9eff; cursor: pointer; height: 4px;
    }
    #slider-year-label {
      font-size: 12px; font-weight: 700; color: #4a9eff;
      min-width: 34px; text-align: center;
    }
    .ts-btn {
      background: #162130; border: 1px solid #1e2e3d;
      color: #7a94a8; padding: 3px 8px; border-radius: 4px;
      font-size: 11px; font-family: 'DM Sans', sans-serif; cursor: pointer;
      white-space: nowrap;
    }
    .ts-btn:hover { color: #4a9eff; border-color: #4a9eff; }
    .ts-btn.playing { color: #e67e00; border-color: #e67e00; }

    /* ── Tab toggle (List / Players) ── */
    #tab-bar {
      display: flex; gap: 0; border-bottom: 1px solid #1e2e3d;
      flex-shrink: 0;
    }
    .tab-btn {
      flex: 1; padding: 6px 0;
      font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 600;
      background: #0c1620; color: #4a6070;
      border: none; border-bottom: 2px solid transparent;
      cursor: pointer; transition: all 0.15s;
    }
    .tab-btn:hover { color: #7a94a8; }
    .tab-btn.active { color: #4a9eff; border-bottom-color: #4a9eff; background: #0f1923; }

    /* ── Players leaderboard ── */
    #players-panel {
      display: none; flex: 1; overflow-y: auto;
      padding: 8px;
    }
    #players-panel.active { display: block; }
    .players-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    }
    .players-col h4 {
      font-size: 10px; font-weight: 700; color: #7a94a8;
      text-transform: uppercase; letter-spacing: 0.06em;
      margin: 0 0 6px; padding-bottom: 4px;
      border-bottom: 1px solid #1e2e3d;
    }
    .player-row {
      display: flex; flex-direction: column;
      padding: 4px 0; border-bottom: 1px solid #0f1923;
      cursor: pointer;
    }
    .player-row:hover .player-name { color: #4a9eff; }
    .player-top {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 4px; margin-bottom: 2px;
    }
    .player-rank { font-size: 9px; color: #4a6070; font-weight: 600; flex-shrink: 0; }
    .player-name {
      font-size: 10px; color: #c8d8e4; font-weight: 600;
      flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .player-vol  { font-size: 10px; color: #fff; font-weight: 700; flex-shrink: 0; }
    .player-meta { font-size: 9px; color: #4a6070; margin-bottom: 3px; }
    .player-bar-track { height: 3px; background: #1a2a38; border-radius: 2px; }
    .player-bar-fill  { height: 3px; background: #4a9eff; border-radius: 2px; }

    /* ── Trends panel ── */
    #trends-panel {
      display: none; flex: 1; overflow-y: auto;
      padding: 8px 8px 16px;
    }
    #trends-panel.active { display: block; }
    .chart-section { margin-bottom: 16px; }
    .chart-label {
      font-size: 10px; font-weight: 700; color: #7a94a8;
      text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: 6px; padding: 0 2px;
    }

    /* ── Refi tier colours ── */
    .refi-badge.tier-critical    { background: #c0392b; }
    .refi-badge.tier-approaching { background: #e67e00; }
    .refi-badge.tier-horizon     { background: #9a7d0a; }
    .prop-card.tier-critical    { border-left-color: #c0392b; }
    .prop-card.tier-approaching { border-left-color: #e67e00; }
    .prop-card.tier-horizon     { border-left-color: #9a7d0a; }
    .refi-alert.tier-critical    { border-left-color: #c0392b; background: #fdecea; }
    .refi-alert.tier-approaching { border-left-color: #e67e00; background: #fff3e0; }
    .refi-alert.tier-horizon     { border-left-color: #9a7d0a; background: #fffde7; }

    /* ── Property list ── */
    #prop-list {
      display: none; flex: 1; overflow-y: auto;
      padding: 4px 8px 16px;
    }
    #prop-list.active { display: block; }
    #prop-list::-webkit-scrollbar { width: 4px; }
    #prop-list::-webkit-scrollbar-thumb { background: #2a3f52; border-radius: 2px; }

    /* ── Property cards ── */
    .prop-card {
      background: #15232f; border: 1px solid #1e2e3d; border-radius: 8px;
      padding: 10px 12px; margin-bottom: 6px;
      cursor: pointer; transition: all 0.15s;
    }
    .prop-card:hover          { border-color: #4a9eff; background: #1a2e40; }
    .prop-card.refi-card      { border-left: 3px solid #e67e00; }
    .prop-address {
      font-size: 12px; font-weight: 600; color: #fff;
      margin-bottom: 4px; line-height: 1.3;
    }
    .prop-tags {
      display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 5px;
    }
    .prop-tag {
      font-size: 10px; font-weight: 600; color: #4a9eff;
      background: #0d1e2e; border: 1px solid #1e3a52;
      padding: 1px 6px; border-radius: 10px;
    }
    .prop-meta {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 2px 8px; font-size: 11px; color: #7a94a8;
    }
    .prop-meta span b { color: #b0c4d4; font-weight: 500; }
    .refi-badge {
      display: inline-block;
      background: #e67e00; color: #fff;
      font-size: 10px; font-weight: 700;
      padding: 2px 7px; border-radius: 10px; margin-bottom: 4px;
    }

    /* ── Popup ── */
    .sale-popup {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px; width: 260px; line-height: 1.6;
    }
    .sale-popup .popup-title {
      font-weight: 700; font-size: 14px; margin-bottom: 4px;
    }
    .sale-popup hr { margin: 4px 0; border-color: #eee; }
    .refi-alert {
      background: #fff3e0; border-left: 3px solid #e67e00;
      padding: 6px 8px; margin: 6px 0; border-radius: 2px;
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════
     SIDEBAR
═══════════════════════════════════════════ -->
<div id="sidebar">
  <div id="sidebar-header">
    <h2>Edmonton Multifamily Sales</h2>
    <p id="header-subtitle">2019 – 2026 YTD &nbsp;|&nbsp; Gettel</p>
  </div>

  <!-- Layer filter buttons -->
  <div id="filter-bar">
    <button class="filter-btn active" onclick="setFilter('all', this)">All Sales</button>
    <button class="filter-btn refi-btn" onclick="setFilter('refi', this)">⏰ Refi Window</button>
    <div style="width:100%;border-top:1px solid #1e2e3d;margin:2px 0;"></div>
    <button class="filter-btn type-btn active" onclick="setTypeFilter('all', this)">All Types</button>
    <button class="filter-btn type-btn" onclick="setTypeFilter('building', this)">Building</button>
    <button class="filter-btn type-btn" onclick="setTypeFilter('land', this)">Land</button>
  </div>

  <!-- Sale Date Range -->
  <div class="filter-section">
    <label>Sale Date Range</label>
    <button class="filter-reset" onclick="resetAll()">Reset all</button>
    <div class="filter-row">
      <span>From</span>
      <input type="date" class="filter-input" id="date-from"
             value="2019-03-01" min="2019-03-01" max="2026-01-26"
             onchange="renderList()">
    </div>
    <div class="filter-row">
      <span>To</span>
      <input type="date" class="filter-input" id="date-to"
             value="2026-01-26" min="2019-03-01" max="2026-01-26"
             onchange="renderList()">
    </div>
  </div>

  <!-- Year Built Range -->
  <div class="filter-section">
    <label>Year Built Range</label>
    <div class="filter-row">
      <span>From</span>
      <input type="number" class="filter-input" id="year-from"
             placeholder="e.g. 1960" min="1900" max="2030"
             oninput="renderList()">
    </div>
    <div class="filter-row">
      <span>To</span>
      <input type="number" class="filter-input" id="year-to"
             placeholder="e.g. 2000" min="1900" max="2030"
             oninput="renderList()">
    </div>
  </div>

  <!-- Search -->
  <div id="search-box">
    <input type="text" id="search-input"
           placeholder="Search address, buyer, seller, zoning…"
           oninput="renderList()">
  </div>

  <!-- Advanced Filters toggle -->
  <div id="adv-toggle" onclick="toggleAdv()">
    <span class="adv-arrow">▶</span> More Filters
  </div>

  <!-- Advanced Filters panel -->
  <div id="adv-filters">

    <!-- Sale Price -->
    <div class="filter-section">
      <label>Sale Price ($)</label>
      <div class="range-pair">
        <input type="number" class="filter-input" id="price-min"
               placeholder="Min" min="0" oninput="renderList()">
        <span class="sep">–</span>
        <input type="number" class="filter-input" id="price-max"
               placeholder="Max" min="0" oninput="renderList()">
      </div>
    </div>

    <!-- Total Units -->
    <div class="filter-section">
      <label>Total Units</label>
      <div class="range-pair">
        <input type="number" class="filter-input" id="units-min"
               placeholder="Min" min="0" oninput="renderList()">
        <span class="sep">–</span>
        <input type="number" class="filter-input" id="units-max"
               placeholder="Max" min="0" oninput="renderList()">
      </div>
    </div>

    <!-- Site Area -->
    <div class="filter-section">
      <label>Site Area (Acres)</label>
      <div class="range-pair">
        <input type="number" class="filter-input" id="area-min"
               placeholder="Min" min="0" step="0.1" oninput="renderList()">
        <span class="sep">–</span>
        <input type="number" class="filter-input" id="area-max"
               placeholder="Max" min="0" step="0.1" oninput="renderList()">
      </div>
      <div style="font-size:10px;color:#4a6070;margin-top:3px;">Sq Ft entries auto-converted. Leave blank to include all.</div>
    </div>

    <!-- Cap Rate -->
    <div class="filter-section">
      <label>Cap Rate (%)</label>
      <div class="range-pair">
        <input type="number" class="filter-input" id="cap-min"
               placeholder="Min" min="0" step="0.1" oninput="renderList()">
        <span class="sep">–</span>
        <input type="number" class="filter-input" id="cap-max"
               placeholder="Max" min="0" step="0.1" oninput="renderList()">
      </div>
    </div>

    <!-- Zoning / Land Use -->
    <div class="filter-section">
      <label>Zoning / Land Use</label>
      <input type="text" class="filter-input" id="zoning-input"
             placeholder="e.g. RA7, DC1, RF5…" oninput="renderList()">
    </div>

    <!-- Buyer / Purchaser -->
    <div class="filter-section">
      <label>Buyer / Purchaser</label>
      <input type="text" class="filter-input" id="buyer-input"
             placeholder="e.g. Cantiro, Smith Holdings…" oninput="renderList()">
    </div>

    <!-- Seller / Vendor -->
    <div class="filter-section">
      <label>Seller / Vendor</label>
      <input type="text" class="filter-input" id="seller-input"
             placeholder="e.g. Melcor, 1234567 Alberta…" oninput="renderList()">
    </div>

  </div><!-- /adv-filters -->

  <!-- Time slider -->
  <div id="time-slider-bar">
    <div class="ts-row">
      <span class="ts-label">Sale Yr</span>
      <input type="range" id="year-slider" min="2010" max="2026" value="2026" step="1"
             oninput="onYearSlider(this.value)">
      <span id="slider-year-label">All</span>
      <button class="ts-btn" id="play-btn" onclick="togglePlay()">&#9654; Play</button>
      <button class="ts-btn" onclick="resetYearSlider()">All</button>
    </div>
  </div>

  <!-- Tab bar -->
  <div id="tab-bar">
    <button class="tab-btn active" id="tab-list"    onclick="toggleTab('list')">List</button>
    <button class="tab-btn"        id="tab-players" onclick="toggleTab('players')">Players</button>
    <button class="tab-btn"        id="tab-trends"  onclick="toggleTab('trends')">Trends</button>
  </div>

  <!-- Sort + count -->
  <div id="list-controls">
    <span id="prop-count">0 properties</span>
    <select id="sort-select" onchange="renderList()">
      <option value="date|desc">Date ↓</option>
      <option value="date|asc">Date ↑</option>
      <option value="yearBuilt|desc">Built ↓</option>
      <option value="yearBuilt|asc">Built ↑</option>
      <option value="price|desc">Price ↓</option>
      <option value="price|asc">Price ↑</option>
      <option value="ppu|desc">PPU ↓</option>
      <option value="ppu|asc">PPU ↑</option>
      <option value="cap|desc">Cap ↓</option>
      <option value="cap|asc">Cap ↑</option>
      <option value="units|desc">Units ↓</option>
      <option value="units|asc">Units ↑</option>
      <option value="area|desc">Area ↓</option>
      <option value="area|asc">Area ↑</option>
    </select>
    <button id="export-btn" onclick="exportToExcel()" title="Export filtered list to Excel">↓ xlsx</button>
  </div>

  <div id="stats-bar"></div>
  <div id="prop-list"></div>
  <div id="players-panel"></div>
  <div id="trends-panel"></div>
</div>

<!-- ═══════════════════════════════════════════
     MAP
═══════════════════════════════════════════ -->
<div id="map"></div>

<!-- Data injected inline by Colab notebook; for local dev place properties.js in same folder -->
<script src="properties.js"></script>

<script>
// ─────────────────────────────────────────────
// Map init
// ─────────────────────────────────────────────
const map = L.map('map', {
  center: [53.5390, -113.5910],
  zoom: 14,
  zoomControl: true
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 20
}).addTo(map);


// ─────────────────────────────────────────────
// Numeric helpers
// ─────────────────────────────────────────────
function ppuToNumber(ppuStr) {
  return parseFloat((ppuStr || '').replace(/[$,]/g, '')) || 0;
}
function parsePrice(s) {
  return parseFloat((s || '').replace(/[$,]/g, '')) || 0;
}
function parseCap(s) {
  return parseFloat((s || '').replace('%', '')) || 0;
}
function parseUnits(s) {
  return parseInt(s) || 0;
}
function parseYear(s) {
  return parseInt(s) || 0;
}

// Normalise site area to Acres (Sq Ft ÷ 43560)
function parseSiteAreaAcres(p) {
  if (!p.siteArea) return null;
  const v = parseFloat(p.siteArea);
  if (isNaN(v)) return null;
  const unit = (p.siteUnits || '').toLowerCase();
  if (unit === 'sq ft' || unit === 'sqft') return v / 43560;
  return v; // assume Acres
}

function fmtVolume(n) {
  if (!n) return '—';
  if (n >= 1e9) return '$' + (n / 1e9).toFixed(1) + 'B';
  if (n >= 1e6) return '$' + (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return '$' + (n / 1e3).toFixed(0) + 'k';
  return '$' + n.toFixed(0);
}

function parseMonthsOut(str) {
  const m = parseInt((str || '').replace(/[^0-9]/g, ''));
  return isNaN(m) ? null : m;
}

let currentTab = 'list';

function toggleTab(tab) {
  currentTab = tab;
  document.getElementById('tab-list').classList.toggle('active',    tab === 'list');
  document.getElementById('tab-players').classList.toggle('active', tab === 'players');
  document.getElementById('tab-trends').classList.toggle('active',  tab === 'trends');
  document.getElementById('list-controls').style.display = tab === 'list' ? '' : 'none';
  document.getElementById('prop-list').classList.toggle('active',     tab === 'list');
  document.getElementById('players-panel').classList.toggle('active', tab === 'players');
  document.getElementById('trends-panel').classList.toggle('active',  tab === 'trends');
  if (tab === 'trends') drawTrends(currentYearData);
}

function refiTier(p) {
  const m = parseMonthsOut(p.monthsOut);
  if (m === null) return 'approaching';
  if (m <= 6)  return 'critical';
  if (m <= 12) return 'approaching';
  return 'horizon';
}


// ─────────────────────────────────────────────
// Color scale (PPU, blue → red via D3 v3)
// ─────────────────────────────────────────────
// Land PPU is per-acre (very different scale) — only use building PPU for the color scale
const ppuValues = allProps
  .filter(p => !p.propType || p.propType !== 'Land')
  .map(p => ppuToNumber(p.ppu)).filter(v => v > 0);
const ppuMin = Math.min(...ppuValues);
const ppuMax = Math.max(...ppuValues);

const colorScale = d3.scale.linear()
  .domain([ppuMin, (ppuMin + ppuMax) / 2, ppuMax])
  .range(['#2166ac', '#fee090', '#d73027']);

function getColor(p) {
  if (p.propType === 'Land') return '#888';
  const v = ppuToNumber(p.ppu);
  if (!v) return '#aaa';
  return colorScale(v);
}


// ─────────────────────────────────────────────
// Layers
// ─────────────────────────────────────────────
const clusterLayer = L.markerClusterGroup();
const refiLayer    = L.featureGroup();
const heatLayer    = L.heatLayer([], { minOpacity: 0.5, maxZoom: 18, radius: 20, blur: 15 });

function popupHTML(p) {
  const areaStr   = p.siteArea
    ? `<b>Site Area:</b> ${p.siteArea} ${p.siteUnits || ''}<br>`
    : '';
  const zoningStr  = p.landUse   ? `<b>Zoning:</b> ${p.landUse}<br>`         : '';
  const descStr    = p.description ? `<b>Type:</b> ${p.description}<br>`      : '';
  const legalStr   = p.legalDesc ? `<b>Legal:</b> ${p.legalDesc}<br>`         : '';
  const idBadge    = p.propId
    ? `<span style="font-size:10px;color:#7a94a8;font-weight:400;">ID #${p.propId}</span>`
    : '';
  return `
    <div class="sale-popup">
      <div class="popup-title">${p.address} ${idBadge}</div>
      <hr>
      <b>Date:</b> ${p.saleDate}<br>
      <b>Sale Price:</b> ${p.salePrice}<br>
      <b>Total Units:</b> ${p.totalUnits}<br>
      <b>PPU:</b> ${p.ppu}<br>
      <b>Cap Rate:</b> ${p.capRate}<br>
      <b>Year Built:</b> ${p.yearBuilt}<br>
      ${areaStr}${zoningStr}${descStr}${legalStr}
      <hr>
      <b>Buyer:</b> ${p.buyer}<br>
      <b>Buyer Dir:</b> ${p.buyerDir}<br>
      <b>Seller:</b> ${p.seller}<br>
      <b>Seller Dir:</b> ${p.sellerDir}<br>
    </div>`;
}

function refiPopupHTML(p) {
  const idBadge = p.propId
    ? `<span style="font-size:10px;color:#7a94a8;font-weight:400;"> ID #${p.propId}</span>`
    : '';
  return `
    <div class="sale-popup">
      <div class="popup-title">${p.address}${idBadge}</div>
      <div class="refi-alert tier-${refiTier(p)}">⏰ Refi in ${p.monthsOut} (${p.refiDate})</div>
      <b>Original Sale:</b> ${p.saleDate}<br>
      <b>Sale Price:</b> ${p.salePrice}<br>
      <b>Total Units:</b> ${p.totalUnits}<br>
      <b>PPU:</b> ${p.ppu}<br>
      <b>Cap Rate:</b> ${p.capRate}<br>
      <hr>
      <b>Owner:</b> ${p.buyer}<br>
      <b>Director:</b> ${p.buyerDir}<br>
    </div>`;
}

// Marker factories — called by renderList() each time filters change
function makeCircleMarker(p) {
  const color = getColor(p);
  return L.circleMarker([p.lat, p.lng], {
    radius: 7,
    color: color,
    fillColor: color,
    fillOpacity: 0.85,
    weight: 3
  })
    .bindPopup(popupHTML(p), { maxWidth: 280 })
    .bindTooltip(`${p.address} | ${p.ppu}`, { sticky: true });
}

function makeRefiMarker(p) {
  return L.marker([p.lat, p.lng], {
    icon: L.AwesomeMarkers.icon({
      markerColor: refiTier(p) === 'critical' ? 'red' : refiTier(p) === 'approaching' ? 'orange' : 'lightred',
      iconColor: 'white',
      icon: 'time',
      prefix: 'glyphicon'
    })
  })
    .bindPopup(refiPopupHTML(p), { maxWidth: 280 })
    .bindTooltip(`⏰ Refi ${p.monthsOut} | ${p.address} | ${p.buyer}`, { sticky: true });
}

clusterLayer.addTo(map);


// ─────────────────────────────────────────────
// PPU color legend
// ─────────────────────────────────────────────
const legend = L.control({ position: 'topright' });
legend.onAdd = function() {
  const div = L.DomUtil.create('div');
  div.innerHTML = `
    <svg width="200" height="44" style="display:block">
      <defs>
        <linearGradient id="ppuGrad" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0%"   stop-color="#2166ac"/>
          <stop offset="50%"  stop-color="#fee090"/>
          <stop offset="100%" stop-color="#d73027"/>
        </linearGradient>
      </defs>
      <rect x="10" y="6" width="180" height="14" fill="url(#ppuGrad)" rx="3"/>
      <text x="10"  y="36" font-family="DM Sans,sans-serif" font-size="10" fill="#333">$${Math.round(ppuMin/1000)}k</text>
      <text x="85"  y="36" font-family="DM Sans,sans-serif" font-size="10" fill="#333" text-anchor="middle">Price Per Unit ($)</text>
      <text x="190" y="36" font-family="DM Sans,sans-serif" font-size="10" fill="#333" text-anchor="end">$${Math.round(ppuMax/1000)}k</text>
    </svg>`;
  div.style.background = 'rgba(255,255,255,0.92)';
  div.style.borderRadius = '6px';
  div.style.padding = '4px';
  div.style.boxShadow = '0 1px 6px rgba(0,0,0,0.2)';
  return div;
};
legend.addTo(map);


// ─────────────────────────────────────────────
// Layer control
// ─────────────────────────────────────────────
L.control.layers(
  {},
  {
    'All Sales': clusterLayer,
    'Refi Window (12–18 months)': refiLayer,
    'Transaction Density': heatLayer
  },
  { position: 'topright', collapsed: false }
).addTo(map);


// ─────────────────────────────────────────────
// Sidebar logic
// ─────────────────────────────────────────────
let currentFilter     = 'all';
let currentTypeFilter = 'all';

function toggleSidebar() {
  const sb  = document.getElementById('sidebar');
  const btn = document.getElementById('sidebar-toggle');
  const lcs = document.querySelectorAll('.leaflet-left');
  const collapsed = sb.classList.toggle('collapsed');
  btn.innerHTML  = collapsed ? '&#9654;' : '&#9664;';
  btn.style.left = collapsed ? '0px' : '400px';
  lcs.forEach(el => { el.style.left = collapsed ? '0px' : '400px'; });
  document.getElementById('map').style.left = collapsed ? '0px' : '400px';
}

function toggleAdv() {
  const toggle = document.getElementById('adv-toggle');
  const panel  = document.getElementById('adv-filters');
  toggle.classList.toggle('open');
  panel.classList.toggle('open');
}

function setFilter(filter, el) {
  currentFilter = filter;
  // only toggle active among the non-type buttons
  document.querySelectorAll('.filter-btn:not(.type-btn)').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderList();
}

function setTypeFilter(filter, el) {
  currentTypeFilter = filter;
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderList();
}

function resetAll() {
  document.getElementById('date-from').value   = DATE_MIN;
  document.getElementById('date-to').value     = DATE_MAX;
  document.getElementById('year-from').value   = '';
  document.getElementById('year-to').value     = '';
  document.getElementById('search-input').value = '';
  document.getElementById('price-min').value   = '';
  document.getElementById('price-max').value   = '';
  document.getElementById('units-min').value   = '';
  document.getElementById('units-max').value   = '';
  document.getElementById('area-min').value    = '';
  document.getElementById('area-max').value    = '';
  document.getElementById('cap-min').value     = '';
  document.getElementById('cap-max').value     = '';
  document.getElementById('zoning-input').value = '';
  document.getElementById('buyer-input').value  = '';
  document.getElementById('seller-input').value = '';
  document.getElementById('sort-select').value = 'date|desc';
  sliderYear = null;
  document.getElementById('year-slider').value = document.getElementById('year-slider').max;
  document.getElementById('slider-year-label').textContent = 'All';
  stopPlay();
  toggleTab('list');
  currentTypeFilter = 'all';
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.type-btn').classList.add('active');
  renderList();
}

function flyTo(lat, lng) {
  map.flyTo([lat, lng], 16, { duration: 1 });
}

// ─────────────────────────────────────────────
// Render list
// ─────────────────────────────────────────────
function getInputVal(id) {
  const el = document.getElementById(id);
  return el ? el.value : '';
}

function renderList() {
  const search   = getInputVal('search-input').toLowerCase();
  const dateFrom = getInputVal('date-from');
  const dateTo   = getInputVal('date-to');
  const yearFrom = getInputVal('year-from') !== '' ? parseInt(getInputVal('year-from')) : null;
  const yearTo   = getInputVal('year-to')   !== '' ? parseInt(getInputVal('year-to'))   : null;
  const priceMin = getInputVal('price-min') !== '' ? parseFloat(getInputVal('price-min')) : null;
  const priceMax = getInputVal('price-max') !== '' ? parseFloat(getInputVal('price-max')) : null;
  const unitsMin = getInputVal('units-min') !== '' ? parseInt(getInputVal('units-min')) : null;
  const unitsMax = getInputVal('units-max') !== '' ? parseInt(getInputVal('units-max')) : null;
  const areaMin  = getInputVal('area-min')  !== '' ? parseFloat(getInputVal('area-min')) : null;
  const areaMax  = getInputVal('area-max')  !== '' ? parseFloat(getInputVal('area-max')) : null;
  const capMin   = getInputVal('cap-min')   !== '' ? parseFloat(getInputVal('cap-min'))  : null;
  const capMax   = getInputVal('cap-max')   !== '' ? parseFloat(getInputVal('cap-max'))  : null;
  const zoningQ  = getInputVal('zoning-input').toLowerCase();
  const buyerQ   = getInputVal('buyer-input').toLowerCase();
  const sellerQ  = getInputVal('seller-input').toLowerCase();
  const sortVal  = getInputVal('sort-select') || 'date|desc';

  let props = allProps;

  // Layer filter
  if (currentFilter === 'refi') props = props.filter(p => p.isRefi);

  // Property type filter
  if (currentTypeFilter !== 'all') {
    props = props.filter(p => (p.propType || '').toLowerCase() === currentTypeFilter);
  }

  // Sale date range
  if (dateFrom) props = props.filter(p => p.saleDateIso >= dateFrom);
  if (dateTo)   props = props.filter(p => p.saleDateIso <= dateTo);

  // Year built range
  if (yearFrom !== null) props = props.filter(p => parseYear(p.yearBuilt) >= yearFrom);
  if (yearTo   !== null) props = props.filter(p => parseYear(p.yearBuilt) <= yearTo);

  // Sale price range
  if (priceMin !== null) props = props.filter(p => parsePrice(p.salePrice) >= priceMin);
  if (priceMax !== null) props = props.filter(p => parsePrice(p.salePrice) <= priceMax);

  // Total units range
  if (unitsMin !== null) props = props.filter(p => parseUnits(p.totalUnits) >= unitsMin);
  if (unitsMax !== null) props = props.filter(p => parseUnits(p.totalUnits) <= unitsMax);

  // Site area range (Acres)
  if (areaMin !== null || areaMax !== null) {
    props = props.filter(p => {
      const a = parseSiteAreaAcres(p);
      if (a === null) return false; // skip records with no area data when a filter is set
      if (areaMin !== null && a < areaMin) return false;
      if (areaMax !== null && a > areaMax) return false;
      return true;
    });
  }

  // Cap rate range
  if (capMin !== null) props = props.filter(p => parseCap(p.capRate) >= capMin);
  if (capMax !== null) props = props.filter(p => parseCap(p.capRate) <= capMax);

  // Zoning filter
  if (zoningQ) {
    props = props.filter(p =>
      (p.landUse || '').toLowerCase().includes(zoningQ)
    );
  }

  // Buyer filter
  if (buyerQ) {
    props = props.filter(p =>
      (p.buyer    || '').toLowerCase().includes(buyerQ) ||
      (p.buyerDir || '').toLowerCase().includes(buyerQ)
    );
  }

  // Seller filter
  if (sellerQ) {
    props = props.filter(p =>
      (p.seller    || '').toLowerCase().includes(sellerQ) ||
      (p.sellerDir || '').toLowerCase().includes(sellerQ)
    );
  }

  // Year slider filter
  if (sliderYear !== null) {
    props = props.filter(p => (p.saleDateIso || '').slice(0, 4) === String(sliderYear));
  }

  // Text search (general — catches all fields)
  if (search) {
    props = props.filter(p =>
      [p.address, p.buyer, p.seller, p.buyerDir, p.sellerDir,
       p.subdivision, p.landUse, p.description, p.propType]
        .some(f => f && f.toLowerCase().includes(search))
    );
  }

  // Sort
  const [sortField, sortDir] = sortVal.split('|');
  props = [...props].sort((a, b) => {
    let av, bv;
    switch (sortField) {
      case 'date':      av = a.saleDateIso || ''; bv = b.saleDateIso || ''; break;
      case 'yearBuilt': av = parseYear(a.yearBuilt); bv = parseYear(b.yearBuilt); break;
      case 'price':     av = parsePrice(a.salePrice); bv = parsePrice(b.salePrice); break;
      case 'ppu':       av = ppuToNumber(a.ppu); bv = ppuToNumber(b.ppu); break;
      case 'cap':       av = parseCap(a.capRate); bv = parseCap(b.capRate); break;
      case 'units':     av = parseUnits(a.totalUnits); bv = parseUnits(b.totalUnits); break;
      case 'area':      av = parseSiteAreaAcres(a) || 0; bv = parseSiteAreaAcres(b) || 0; break;
      default:          av = a.saleDateIso || ''; bv = b.saleDateIso || '';
    }
    if (sortDir === 'desc') return av < bv ? 1 : av > bv ? -1 : 0;
    return av > bv ? 1 : av < bv ? -1 : 0;
  });

  // Store for export
  filteredProps = props;

  // ── Year data for trends ──
  const byYear = {};
  props.forEach(p => {
    const yr = (p.saleDateIso || '').slice(0, 4);
    if (!yr) return;
    if (!byYear[yr]) byYear[yr] = { vol: 0, ppuVals: [], count: 0 };
    byYear[yr].vol += parsePrice(p.salePrice);
    const ppu = ppuToNumber(p.ppu);
    if (ppu > 0) byYear[yr].ppuVals.push(ppu);
    byYear[yr].count++;
  });
  currentYearData = Object.keys(byYear).sort().map(yr => ({
    year:   yr,
    vol:    byYear[yr].vol,
    avgPPU: byYear[yr].ppuVals.length
      ? byYear[yr].ppuVals.reduce((a, b) => a + b, 0) / byYear[yr].ppuVals.length
      : 0,
    count:  byYear[yr].count,
  }));
  if (currentTab === 'trends') drawTrends(currentYearData);

  // ── Stats bar ──
  const totalVol = props.reduce((s, p) => s + parsePrice(p.salePrice), 0);
  const ppuVals  = props.map(p => ppuToNumber(p.ppu)).filter(v => v > 0);
  const capVals  = props.map(p => parseCap(p.capRate)).filter(v => v > 0);
  const avgPPU   = ppuVals.length  ? ppuVals.reduce((s, v) => s + v, 0) / ppuVals.length  : 0;
  const avgCap   = capVals.length  ? capVals.reduce((s, v) => s + v, 0) / capVals.length  : 0;
  document.getElementById('stats-bar').innerHTML = `
    <div class="stat-item"><span class="stat-val">${fmtVolume(totalVol)}</span><span class="stat-label">Total Volume</span></div>
    <div class="stat-item"><span class="stat-val">${avgPPU ? fmtVolume(avgPPU) : '—'}</span><span class="stat-label">Avg PPU</span></div>
    <div class="stat-item"><span class="stat-val">${avgCap ? avgCap.toFixed(1) + '%' : '—'}</span><span class="stat-label">Avg Cap Rate</span></div>`;

  // ── Update map layers to match filtered set ──
  clusterLayer.clearLayers();
  refiLayer.clearLayers();
  props.forEach(p => {
    clusterLayer.addLayer(makeCircleMarker(p));
    if (p.isRefi) refiLayer.addLayer(makeRefiMarker(p));
  });
  if (heatLayer.setLatLngs) {
    heatLayer.setLatLngs(props.map(p => [p.lat, p.lng]));
  }

  // Update count
  document.getElementById('prop-count').textContent =
    `${props.length} propert${props.length === 1 ? 'y' : 'ies'}`;

  // ── Players leaderboard ──
  function buildLeader(key, filterFn) {
    const map = {};
    props.forEach(p => {
      const name = p[key];
      if (!name) return;
      if (!map[name]) map[name] = { vol: 0, count: 0 };
      map[name].vol   += parsePrice(p.salePrice);
      map[name].count += 1;
    });
    return Object.entries(map)
      .sort((a, b) => b[1].vol - a[1].vol)
      .slice(0, 8)
      .map(([name, d]) => ({ name, ...d }));
  }

  function renderLeaderCol(entries, type) {
    if (!entries.length) return '<p style="font-size:10px;color:#4a6070;padding:4px 0">No data</p>';
    const maxVol = entries[0].vol;
    return entries.map((e, i) => `
      <div class="player-row" onclick="applyPlayerFilter('${type}', ${JSON.stringify(e.name)})">
        <div class="player-top">
          <span class="player-rank">${i + 1}</span>
          <span class="player-name" title="${e.name}">${e.name}</span>
          <span class="player-vol">${fmtVolume(e.vol)}</span>
        </div>
        <div class="player-meta">${e.count} deal${e.count !== 1 ? 's' : ''}</div>
        <div class="player-bar-track"><div class="player-bar-fill" style="width:${Math.round(e.vol / maxVol * 100)}%"></div></div>
      </div>`).join('');
  }

  const buyers  = buildLeader('buyer');
  const sellers = buildLeader('seller');
  document.getElementById('players-panel').innerHTML = `
    <div class="players-grid">
      <div class="players-col">
        <h4>Top Buyers</h4>${renderLeaderCol(buyers, 'buyer')}
      </div>
      <div class="players-col">
        <h4>Top Sellers</h4>${renderLeaderCol(sellers, 'seller')}
      </div>
    </div>`;

  // Render cards
  document.getElementById('prop-list').innerHTML = props.map(p => {
    const tags = [];
    if (p.landUse)    tags.push(p.landUse);
    if (p.description) tags.push(p.description);
    if (p.siteArea)   tags.push(`${p.siteArea} ${p.siteUnits || ''}`);
    const tagsHTML = tags.length
      ? `<div class="prop-tags">${tags.map(t => `<span class="prop-tag">${t}</span>`).join('')}</div>`
      : '';

    const idLabel = p.propId ? `<span style="font-size:10px;color:#4a6070;font-weight:400;float:right;">ID #${p.propId}</span>` : '';
    const tier = p.isRefi ? refiTier(p) : '';
    return `
    <div class="prop-card ${p.isRefi ? `refi-card tier-${tier}` : ''}" onclick="flyTo(${p.lat}, ${p.lng})">
      ${p.isRefi ? `<div class="refi-badge tier-${tier}">⏰ REFI ${p.monthsOut ? p.monthsOut.toUpperCase() : ''}</div>` : ''}
      <div class="prop-address">${idLabel}${p.address}</div>
      ${tagsHTML}
      <div class="prop-meta">
        <span><b>Date</b> ${p.saleDate}</span>
        <span><b>Built</b> ${p.yearBuilt || '—'}</span>
        <span><b>Price</b> ${p.salePrice}</span>
        <span><b>Units</b> ${p.totalUnits || '—'}</span>
        <span><b>PPU</b> ${p.ppu}</span>
        <span><b>Cap</b> ${p.capRate}</span>
        <span style="grid-column:span 2"><b>Buyer</b> ${p.buyer}</span>
        <span style="grid-column:span 2"><b>Seller</b> ${p.seller}</span>
        ${p.isRefi ? `<span style="grid-column:span 2"><b>Refi Due</b> ${p.refiDate}</span>` : ''}
      </div>
    </div>`;
  }).join('');
}

let filteredProps   = [];
let currentYearData = [];

// ── Time slider state ──
let sliderYear    = null;  // null = all years
let playInterval  = null;
let sliderYearMin = 2010;
let sliderYearMax = 2026;

function initYearSlider() {
  const years = (typeof allProps !== 'undefined' ? allProps : [])
    .map(p => parseInt((p.saleDateIso || '').slice(0, 4)))
    .filter(y => y > 1990);
  if (!years.length) return;
  sliderYearMin = Math.min(...years);
  sliderYearMax = Math.max(...years);
  const slider = document.getElementById('year-slider');
  slider.min   = sliderYearMin;
  slider.max   = sliderYearMax;
  slider.value = sliderYearMax;
}

function onYearSlider(val) {
  sliderYear = parseInt(val);
  document.getElementById('slider-year-label').textContent = val;
  renderList();
}

function resetYearSlider() {
  sliderYear = null;
  const slider = document.getElementById('year-slider');
  slider.value = slider.max;
  document.getElementById('slider-year-label').textContent = 'All';
  stopPlay();
  renderList();
}

function togglePlay() {
  if (playInterval) { stopPlay(); } else { startPlay(); }
}

function startPlay() {
  const slider = document.getElementById('year-slider');
  let year = sliderYearMin;
  sliderYear = year;
  slider.value = year;
  document.getElementById('slider-year-label').textContent = year;
  document.getElementById('play-btn').textContent = '⏸ Pause';
  document.getElementById('play-btn').classList.add('playing');
  renderList();
  playInterval = setInterval(() => {
    year++;
    if (year > sliderYearMax) { stopPlay(); return; }
    sliderYear = year;
    slider.value = year;
    document.getElementById('slider-year-label').textContent = year;
    renderList();
  }, 900);
}

function stopPlay() {
  if (playInterval) { clearInterval(playInterval); playInterval = null; }
  document.getElementById('play-btn').textContent = '▶ Play';
  document.getElementById('play-btn').classList.remove('playing');
}

// ─────────────────────────────────────────────
// Trend charts (pure SVG)
// ─────────────────────────────────────────────
function drawTrends(yearData) {
  const panel = document.getElementById('trends-panel');
  if (!yearData.length) {
    panel.innerHTML = '<p style="padding:20px;font-size:11px;color:#4a6070;text-align:center;">No data for current filters.</p>';
    return;
  }

  const W = 372, padL = 46, padR = 10, padT = 12, padB = 28;
  const innerW = W - padL - padR;
  const n = yearData.length;
  const barSpacing = innerW / n;
  const barW = Math.max(6, Math.floor(barSpacing * 0.7));

  // ── Volume bar chart ──
  const barInnerH = 90;
  const barTotalH = padT + barInnerH + padB;
  const maxVol = Math.max(...yearData.map(d => d.vol));
  const volStep = Math.pow(10, Math.floor(Math.log10(maxVol))) * Math.ceil(maxVol / Math.pow(10, Math.floor(Math.log10(maxVol))) / 4);
  const volTicks = [0, 1, 2, 3, 4].map(i => i * volStep).filter(v => v <= maxVol * 1.15);

  const volTickSVG = volTicks.map(v => {
    const y = padT + barInnerH - Math.round((v / maxVol) * barInnerH);
    return `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#1e2e3d" stroke-width="1"/>
      <text x="${padL - 4}" y="${y + 3}" text-anchor="end" font-size="9" fill="#4a6070" font-family="DM Sans,sans-serif">${fmtVolume(v)}</text>`;
  }).join('');

  const barsSVG = yearData.map((d, i) => {
    const bh  = Math.max(1, Math.round((d.vol / maxVol) * barInnerH));
    const bx  = padL + i * barSpacing + (barSpacing - barW) / 2;
    const by  = padT + barInnerH - bh;
    const cx  = (bx + barW / 2).toFixed(1);
    return `<rect x="${bx.toFixed(1)}" y="${by}" width="${barW}" height="${bh}" fill="#4a9eff" rx="2" opacity="0.85">
        <title>${d.year}: ${fmtVolume(d.vol)} · ${d.count} deal${d.count !== 1 ? 's' : ''}</title>
      </rect>
      <text x="${cx}" y="${padT + barInnerH + 16}" text-anchor="middle" font-size="9" fill="#4a6070" font-family="DM Sans,sans-serif">${d.year.slice(2)}</text>`;
  }).join('');

  const barSVG = `<div class="chart-section">
    <div class="chart-label">Volume by Year</div>
    <svg width="${W}" height="${barTotalH}" style="display:block;overflow:visible">${volTickSVG}${barsSVG}</svg>
  </div>`;

  // ── Avg PPU line chart ──
  const ppuData = yearData.filter(d => d.avgPPU > 0);
  let lineSVG = '';

  if (ppuData.length >= 2) {
    const lineInnerH = 70;
    const lineTotalH = padT + lineInnerH + padB;
    const minPPU = Math.min(...ppuData.map(d => d.avgPPU));
    const maxPPU = Math.max(...ppuData.map(d => d.avgPPU));
    const ppuRange = maxPPU - minPPU || 1;

    const ppuTickSVG = [0, 0.5, 1].map(t => {
      const v = minPPU + t * ppuRange;
      const y = padT + lineInnerH - Math.round(t * lineInnerH);
      return `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#1e2e3d" stroke-width="1"/>
        <text x="${padL - 4}" y="${y + 3}" text-anchor="end" font-size="9" fill="#4a6070" font-family="DM Sans,sans-serif">${fmtVolume(v)}</text>`;
    }).join('');

    const pts = ppuData.map(d => {
      const i  = yearData.findIndex(y => y.year === d.year);
      const cx = padL + i * barSpacing + barSpacing / 2;
      const cy = padT + lineInnerH - Math.round(((d.avgPPU - minPPU) / ppuRange) * lineInnerH);
      return { cx, cy, d };
    });

    const xLabelsSVG = yearData.map((d, i) => {
      const cx = (padL + i * barSpacing + barSpacing / 2).toFixed(1);
      return `<text x="${cx}" y="${padT + lineInnerH + 16}" text-anchor="middle" font-size="9" fill="#4a6070" font-family="DM Sans,sans-serif">${d.year.slice(2)}</text>`;
    }).join('');

    const polyline = `<polyline points="${pts.map(p => `${p.cx.toFixed(1)},${p.cy}`).join(' ')}" fill="none" stroke="#e67e00" stroke-width="2" stroke-linejoin="round"/>`;
    const dots = pts.map(p => `<circle cx="${p.cx.toFixed(1)}" cy="${p.cy}" r="3.5" fill="#e67e00" stroke="#0f1923" stroke-width="1.5">
        <title>${p.d.year}: ${fmtVolume(p.d.avgPPU)} avg PPU</title>
      </circle>`).join('');

    lineSVG = `<div class="chart-section">
      <div class="chart-label">Avg PPU by Year</div>
      <svg width="${W}" height="${lineTotalH}" style="display:block;overflow:visible">${ppuTickSVG}${polyline}${dots}${xLabelsSVG}</svg>
    </div>`;
  }

  panel.innerHTML = barSVG + lineSVG;
}

function applyPlayerFilter(type, name) {
  if (type === 'buyer') {
    document.getElementById('buyer-input').value = name;
    document.getElementById('seller-input').value = '';
  } else {
    document.getElementById('seller-input').value = name;
    document.getElementById('buyer-input').value = '';
  }
  toggleTab('list');
  renderList();
}

document.addEventListener('DOMContentLoaded', () => {
  initYearSlider();
  toggleTab('list');
  renderList();
});

// ─────────────────────────────────────────────
// Excel export
// ─────────────────────────────────────────────
function exportToExcel() {
  if (typeof XLSX === 'undefined') {
    alert('Export library not loaded. Check your internet connection and refresh.');
    return;
  }
  if (!filteredProps.length) {
    alert('No properties to export.');
    return;
  }

  const rows = filteredProps.map(p => {
    const ppuMeasure = p.ppuMeasure || (p.ppu || '').split('/').slice(1).join('/') || '';
    return {
      'Home Path':           '',
      '&Home':               '',
      'Link':                p.propId ? 'View PDF' : '',
      'Prop ID':             p.propId ? parseInt(p.propId) : '',
      'Property Class':      p.propClass      || '',
      'Property Type':       p.propType       || '',
      'Ownership Type':      p.ownershipType  || '',
      'Description':         p.description    || '',
      'Land Use Class':      p.landUse        || '',
      'Address':             p.address        || '',
      'City':                p.city           || '',
      'Full Address':        p.address        || '',
      'Vendor':              p.seller         || '',
      'Vendor Company':      p.seller         || '',
      'Vendor Director':     p.sellerDir      || '',
      'Purchaser':           p.buyer          || '',
      'Purchaser Company':   p.buyer          || '',
      'Purchaser Director':  p.buyerDir       || '',
      'Legal Description':   p.legalDesc      || '',
      'Subdivision':         p.subdivision    || '',
      'Site Area':           p.siteArea  ? parseFloat(p.siteArea)  : '',
      'Site Units':          p.siteUnits      || '',
      'Bldg Area':           p.bldgArea  ? parseFloat(p.bldgArea)  : '',
      'Bldg Units':          p.bldgUnits      || '',
      'Sale Price':          parsePrice(p.salePrice) || '',
      'Sale Date':           p.saleDateIso    || '',
      'Unit Price':          ppuToNumber(p.ppu) || '',
      'Unit Price Measure':  ppuMeasure,
      'Cap Rate':            parseCap(p.capRate) || '',
      'Total Units':         p.totalUnits !== undefined ? parseUnits(p.totalUnits) : '',
      'Year Built':          parseYear(p.yearBuilt) || '',
      'Year Sold':           p.yearSold ? parseInt(p.yearSold) : '',
      'latitude':            p.lat,
      'longitude':           p.lng,
    };
  });

  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Properties');
  const dateStr = new Date().toISOString().slice(0, 10);
  XLSX.writeFile(wb, `refi-map-export-${dateStr}.xlsx`);
}
